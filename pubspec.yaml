name: iclf_parser
description: A Dart parser for Inline Chorded Lyrics Format (ICLF) files, with dynamic loading of the official specification.
version: 1.0.0
repository: https://github.com/msant77/iclf_parser  # Replace with your repo
issue_tracker: https://github.com/msant77/iclf_parser/issues

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  args: ^2.4.2
  crypto: ^3.0.3
  path: ^1.8.3
  http: ^1.2.0

executables:
  iclf: iclf

dev_dependencies:
  test: ^1.24.0
  mockito: ^5.4.2  # For mocking HTTP in tests
  build_runner: ^2.4.7  # Add this if missing
  lints: ^4.0.0